name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer
        # This action is specifically maintained for Kivy/KivyMD
        uses: kivymd/kivymd-action@master
        with:
          buildozer_version: master
          python_version: 3.11
          # This command ensures we skip the broken permission check
          command: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReadingMasteryApp-APK
          path: bin/*.apk
