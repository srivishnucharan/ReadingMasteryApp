name: Build with Docker (Guaranteed to Work)
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Files
        run: |
          echo "=== buildozer.spec requirements ==="
          grep "requirements" buildozer.spec
          echo ""
          echo "=== Checking for required files ==="
          ls -la main.py backend.py library.json

      - name: Build with Buildozer Docker
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: stable
          command: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ReadingMastery-APK-Docker
          path: bin/*.apk

      - name: Upload Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-build-logs
          path: .buildozer/
