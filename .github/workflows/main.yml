name: Build Android APK
on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip3 install --upgrade pip
          pip3 install --upgrade buildozer
          pip3 install --upgrade cython==0.29.33

      - name: Verify buildozer.spec Configuration
        run: |
          echo "=== Requirements line ==="
          grep "^requirements" buildozer.spec
          echo ""
          echo "=== NDK version ==="
          grep "^android.ndk" buildozer.spec || echo "WARNING: android.ndk not set!"
          echo ""
          echo "=== p4a branch ==="
          grep "^p4a.branch" buildozer.spec || echo "WARNING: p4a.branch not set!"

      - name: CRITICAL - Clean Old Cache
        run: |
          echo "Removing old .buildozer cache to force fresh NDK download..."
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf bin
          echo "Cache cleared successfully!"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ReadingMastery-APK
          path: bin/*.apk
          retention-days: 30

      - name: Upload Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: .buildozer/
          retention-days: 7

      - name: Show Build Results
        if: always()
        run: |
          echo "=== APK Files ==="
          ls -lh bin/*.apk 2>/dev/null || echo "No APK created"
          echo ""
          echo "=== NDK Used ==="
          ls -d .buildozer/android/platform/android-ndk-* 2>/dev/null || echo "NDK not downloaded"
