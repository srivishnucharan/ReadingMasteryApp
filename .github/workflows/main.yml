name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        # Using the official Kivy Buildozer action
        uses: kivy/buildozer-action@v1
        with:
          buildozer_version: master
          python_version: 3.11

      - name: Upload APK
        # Updated to v4 to fix the deprecation error
        uses: actions/upload-artifact@v4
        with:
          name: ReadingMasteryApp-APK
          path: bin/*.apk
