name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer
        # Corrected name and removed invalid python_version input
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          buildozer_version: master
          # Optional: Specify working directory if buildozer.spec is not in root
          workdir: . 

      - name: Upload APK
        # Updated to v4 to fix the deprecation error
        uses: actions/upload-artifact@v4
        with:
          name: ReadingMasteryApp-APK
          path: bin/*.apk
