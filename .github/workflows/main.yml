name: Build Android APK
on: 
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Cache Buildozer
        uses: actions/cache@v3
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('**/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-11-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev

      - name: Verify Project Files
        run: |
          echo "Checking for required files..."
          ls -la
          echo "Checking buildozer.spec..."
          cat buildozer.spec | head -20
          echo "Checking requirements.txt..."
          cat requirements.txt
          echo "Checking library.json..."
          ls -la library.json
          echo "Checking backend.py..."
          ls -la backend.py

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          buildozer_version: stable
          command: buildozer -v android debug
          workdir: .
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ReadingMastery-APK
          path: bin/*.apk
          retention-days: 30

      - name: Upload Build Logs (on success)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-logs-success
          path: |
            .buildozer/android/platform/build-*/logs/
            .buildozer/android/logs/
          retention-days: 7

      - name: Upload Build Logs (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-failure
          path: |
            .buildozer/
            *.log
          retention-days: 14

      - name: List Build Output
        if: always()
        run: |
          echo "Contents of bin directory:"
          ls -la bin/ || echo "bin/ directory not found"
          echo "Contents of .buildozer directory:"
          ls -la .buildozer/ || echo ".buildozer/ directory not found"
          echo "Checking for any APK files:"
          find . -name "*.apk" -type f || echo "No APK files found"
