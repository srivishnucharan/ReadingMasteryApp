name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer
        # Corrected name: ArtemSBulgakov
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          buildozer_version: master
          python_version: 3.11

      - name: Upload APK
        # Corrected to v4 to fix the deprecation error
        uses: actions/upload-artifact@v4
        with:
          name: ReadingMasteryApp-APK
          path: bin/*.apk
