name: Build Android APK - FINAL WORKING VERSION
on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # Use Ubuntu 22.04 instead of latest (24.04 has issues)
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-11-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer and Dependencies
        run: |
          pip3 install --upgrade pip setuptools wheel
          pip3 install --upgrade buildozer
          pip3 install --upgrade cython==0.29.33
          buildozer --version

      - name: Verify Configuration
        run: |
          echo "=== Requirements ==="
          grep "^requirements" buildozer.spec
          echo ""
          echo "=== NDK ==="
          grep "^android.ndk" buildozer.spec
          echo ""
          echo "=== p4a branch ==="
          grep "^p4a.branch" buildozer.spec

      - name: Clean All Caches
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf bin
          mkdir -p bin

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ReadingMastery-APK
          path: bin/*.apk
          retention-days: 30

      - name: Upload Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: .buildozer/
          retention-days: 7

      - name: Show Results
        if: always()
        run: |
          echo "=== APK Files ==="
          ls -lh bin/ 2>/dev/null || echo "No bin directory"
          echo ""
          echo "=== NDK Downloaded ==="
          ls -d .buildozer/android/platform/android-ndk-* 2>/dev/null || echo "No NDK"
